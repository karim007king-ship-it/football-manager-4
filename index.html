<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="مدير الكرة">

<title>مدير كرة القدم Pro</title>
<link rel="stylesheet" href="ui-polish.css">
<style>
:root{--bg:#0F1A24;--card:#1E2A3A;--pr:#4CAF50;--gold:#FFC107;--tx:#fff;--dim:#B0BEC5;--red:#E53935;--blue:#42A5F5}
*{box-sizing:border-box;font-family:'Segoe UI',Tahoma,Arial,sans-serif}
body{background:var(--bg);color:var(--tx);margin:0;padding:10px;padding-bottom:calc(75px + env(safe-area-inset-bottom))}
.header{background:var(--card);padding:12px;border-radius:12px;margin-bottom:10px}
.header h1{margin:0;color:var(--gold);font-size:17px;display:flex;justify-content:space-between}
.stats{display:flex;justify-content:space-between;margin-top:8px;font-size:12px;color:var(--dim)}
#content{background:var(--card);padding:14px;border-radius:12px;min-height:340px;margin-bottom:10px}
.title{color:var(--gold);border-bottom:1px solid #333;padding-bottom:8px;margin-top:0;font-size:17px}
.row{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:7px 0;border-bottom:1px solid #2a3a4a;font-size:13px}
.hl{color:var(--gold);font-weight:bold}.win{color:var(--pr)}.loss{color:var(--red)}.dim{color:var(--dim);font-size:11px}
.nav-bar{position:fixed;bottom:0;left:0;right:0;background:#0A1219;display:flex;justify-content:space-around;padding:6px 2px calc(6px + env(safe-area-inset-bottom))}
.nav-btn{background:none;border:none;color:var(--dim);font-size:11px;display:flex;flex-direction:column;align-items:center;padding:4px}
.nav-btn.active{color:var(--pr)}.nav-btn span{font-size:20px}
.action-btn{width:100%;padding:12px;background:var(--pr);color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:bold;margin-top:10px}
.gold{background:var(--gold);color:#000}.mini{padding:5px 9px;border:none;border-radius:6px;color:#fff;background:var(--pr);font-size:12px}
.mini.r{background:var(--red)}
#console{display:none;background:#000;padding:10px;border-radius:8px;font-family:monospace;font-size:13px;height:230px;overflow-y:auto;margin-bottom:8px}
.ll{margin-bottom:4px;border-bottom:1px dashed #333;padding-bottom:3px;white-space:pre-line}
.log-goal{color:var(--gold);font-weight:bold}.log-info{color:var(--blue)}.log-bad{color:var(--red)}
#ctl{display:none}.pitch{position:relative;height:64px;margin:6px 0;border-radius:6px;background:linear-gradient(90deg,transparent 49.5%,#fff6 49.5%,#fff6 50.5%,transparent 50.5%),#1b5e20;border:2px solid #ffffff44}
.pitch:before,.pitch:after{content:'';position:absolute;top:30%;height:40%;width:8px;border:2px solid #fff6}.pitch:before{left:0;border-left:none}.pitch:after{right:0;border-right:none}
.bl{position:absolute;width:10px;height:10px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);transition:left .35s,top .35s;box-shadow:0 0 6px #fff}
.mom{height:6px;background:var(--red);border-radius:3px;overflow:hidden}.mom i{display:block;height:6px;background:var(--pr)}#sb{display:none;background:#0b1520;border-radius:8px;padding:8px;margin-bottom:8px}.sbm{text-align:center;font-size:18px;color:var(--gold);margin-bottom:4px}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:8px 0}
.cb{padding:9px 4px;background:#2c3b4e;color:#fff;border:2px solid transparent;border-radius:6px;font-size:13px}
.cb.sel{border-color:var(--pr);background:#24493a}
table{width:100%;border-collapse:collapse;font-size:12px;text-align:center}
td,th{padding:6px 2px;border-bottom:1px solid #2a3a4a}th{color:var(--dim)}td:nth-child(2){text-align:right}
.me{background:rgba(76,175,80,.2);font-weight:bold}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);align-items:center;justify-content:center;z-index:9;padding:20px}
#mbox{background:var(--card);padding:18px;border-radius:12px;width:100%;max-width:360px;font-size:14px;line-height:1.7;max-height:80vh;overflow-y:auto}
#mbox .btns{display:flex;gap:8px}#mbox button{flex:1;padding:10px;border:none;border-radius:8px;color:#fff;font-size:14px;margin-top:12px}

html{-webkit-tap-highlight-color:transparent}body{-webkit-user-select:none;user-select:none;padding-top:calc(10px + env(safe-area-inset-top))}
.header{position:sticky;top:0;z-index:5;background:linear-gradient(135deg,#1E2A3A,#16222f);border:1px solid #ffffff10;box-shadow:0 4px 14px #0008}
.cbar{height:4px;background:#ffffff14;border-radius:2px;margin-top:8px;overflow:hidden}.cbar i{display:block;height:4px;width:0;transition:width .5s,background .5s}
#content{border:1px solid #ffffff0d;animation:fi .25s}@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
button{cursor:pointer;transition:transform .08s,filter .15s}button:active{transform:scale(.96);filter:brightness(1.15)}
.action-btn{box-shadow:0 3px 8px #0006}.action-btn.alt{background:#2c3b4e;margin-top:8px;box-shadow:none}
.nav-bar{border-top:1px solid #ffffff12;box-shadow:0 -4px 14px #0008}.nav-btn{position:relative;flex:1;transition:color .2s}
.nav-btn.active:before{content:'';position:absolute;top:-6px;width:26px;height:3px;background:var(--pr);border-radius:0 0 3px 3px}.nav-btn.active span{transform:scale(1.15)}.nav-btn span{transition:transform .2s}
.hero{text-align:center;background:linear-gradient(160deg,#1b5e20,#0d3b14);border-radius:14px;padding:14px;margin-bottom:10px;border:1px solid #ffffff22}
.hero .vs{display:flex;align-items:center;justify-content:center;gap:10px;font-size:17px;margin:8px 0 2px}.hero .vs i{color:var(--gold);font-style:normal}
.hero .action-btn{background:var(--gold);color:#000;font-size:16px;padding:14px}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.chip{background:#0b1520;border-radius:10px;padding:9px 4px;text-align:center;display:flex;flex-direction:column;gap:2px;border:1px solid #ffffff0d}
.chip b{font-size:16px;color:var(--gold)}.chip small{font-size:10px;color:var(--dim)}.chip.bad{border-color:var(--red)}.chip.good{border-color:var(--pr)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row:last-child{border-bottom:none}.title{letter-spacing:.2px}
#mbox{animation:fi .2s;border:1px solid #ffffff18;box-shadow:0 10px 30px #000a}
.pitch{height:150px!important;background:radial-gradient(circle at 50% 50%,transparent 17%,#fff5 17.5%,#fff5 19%,transparent 19.5%),linear-gradient(90deg,transparent 49.5%,#fff6 49.5%,#fff6 50.5%,transparent 50.5%),repeating-linear-gradient(90deg,#1b5e20 0 10%,#217a27 10% 20%)!important}
.pitch:before,.pitch:after{top:25%!important;height:50%!important;width:14%!important}
.pl{position:absolute;width:9px;height:9px;border-radius:50%;transform:translate(-50%,-50%);border:1px solid #0006}.pa{background:#42A5F5}.pb{background:#E53935}.bl{z-index:2;width:11px!important;height:11px!important}
.flash{animation:gf .9s}.flashb{animation:gb .9s}@keyframes gf{0%,60%{background:#4CAF5099}100%{background:#0b1520}}@keyframes gb{0%,60%{background:#E5393599}100%{background:#0b1520}}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}.three .action-btn{font-size:13px;padding:12px 2px}
.pcard{background:#0b1520;border:1px solid #ffffff14;border-radius:12px;padding:10px;margin:8px 0}.pcard p{margin:6px 0;line-height:1.7}

/* ===== v22: هوية بصرية "ليلة المباراة" ===== */
:root{--bg:#0b141d;--card:#15222f;--pr:#2fb36d;--gold:#f2b632;--red:#d7263d;--blue:#4aa3e8;--chalk:#e8efe9;--dim:#9db0bd;--line:#ffffff14}
body{background:radial-gradient(120% 60% at 50% 0,#12283a 0,var(--bg) 60%) fixed;padding-bottom:calc(92px + env(safe-area-inset-bottom))}
.header{border-radius:16px;border:1px solid var(--line);background:linear-gradient(135deg,#17293a,#101c28)}
.header h1{font-size:18px;letter-spacing:0}
.stats{font-size:12px}.stats span:first-child{color:var(--gold);font-weight:700}
.cbar{height:5px;border-radius:3px}.cbar i{height:5px;border-radius:3px}
#content{border-radius:16px;background:linear-gradient(180deg,#172635,#14212e)}
.title{border-bottom:none;border-right:4px solid var(--pr);padding:2px 10px 2px 0;font-size:18px}
h3.title{border-right-color:var(--gold);font-size:15px}
.row{padding:10px 0;border-bottom:1px solid var(--line)}
.dim{color:var(--dim)}
.hero{position:relative;overflow:hidden;border-radius:18px;border:1px solid #ffffff30;padding:18px 14px 14px;
 background:radial-gradient(circle at 50% 46%,transparent 15%,#ffffff40 15.4%,#ffffff40 16.4%,transparent 16.8%),
 linear-gradient(90deg,transparent 49.7%,#ffffff40 49.7%,#ffffff40 50.3%,transparent 50.3%),
 repeating-linear-gradient(90deg,#14612c 0 12.5%,#1a7434 12.5% 25%)}
.hero:before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,#00000066,#00000033 45%,#000000aa);pointer-events:none}
.hero>*{position:relative}
.hero .vs{font-size:20px;font-weight:800;gap:12px;margin:12px 0 8px;text-shadow:0 2px 6px #000a}
.hero .vs i{font-size:14px;color:var(--chalk);opacity:.8}
.hero .action-btn{background:linear-gradient(180deg,#ffd45e,#f2b632);box-shadow:0 4px 14px #000a}
.chips{gap:8px}.chip{border-radius:12px;background:#0d1822;padding:11px 4px}
.chip b{font-size:19px}.chip small:first-child{color:var(--dim)}
.action-btn{min-height:46px;border-radius:12px;background:linear-gradient(180deg,#38c27a,#27a05f);box-shadow:0 3px 10px #0007;text-shadow:0 1px 2px #0004}
.action-btn.gold{background:linear-gradient(180deg,#ffd45e,#f2b632);text-shadow:none}
.action-btn.alt{background:#1f3144;border:1px solid var(--line);box-shadow:none;text-shadow:none}
.mini{border-radius:8px;padding:6px 11px;background:#27a05f}.mini.r{background:var(--red)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.nav-bar{left:10px;right:10px;bottom:calc(8px + env(safe-area-inset-bottom));padding:6px 4px;border-radius:20px;background:#0a121bf0;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid #ffffff1c}
.nav-btn{border-radius:14px;padding:5px 2px}.nav-btn.active{background:#2fb36d22}
.nav-btn.active:before{top:-7px;background:var(--gold)}
.ovr{display:inline-block;min-width:38px;text-align:center;padding:5px 6px;border-radius:9px;font-weight:800;font-size:15px;color:#06130b}
.ovr.o1{background:linear-gradient(180deg,#ffd45e,#e0a21c)}.ovr.o2{background:#43c47d}.ovr.o3{background:#7cc2f0}.ovr.o4{background:#8fa0ad}
table{border-collapse:separate;border-spacing:0 3px}
td,th{border-bottom:none;padding:8px 2px}tbody tr td,tr:not(:first-child) td{background:#0f1b27}
tr:not(:first-child) td:first-child{border-radius:0 8px 8px 0;color:var(--dim)}tr:not(:first-child) td:last-child{border-radius:8px 0 0 8px;font-weight:800;color:var(--gold)}
tr.me td{background:#1d4a35!important}
#sb{border-radius:12px;border:1px solid var(--line);background:#0a131c}.sbm{font-size:22px;font-weight:800}
#console{border-radius:12px;border:1px solid var(--line);background:#060c12}
.pitch{border-radius:12px!important}
.cb{border-radius:10px;background:#1f3144;min-height:42px}.cb.sel{border-color:var(--pr);background:#1d4a35}
.pcard{border-radius:14px}
#modal{backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
#mbox{border-radius:16px}#mbox button{border-radius:10px;min-height:44px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== v23: رسم لحظة الهدف ===== */
.gl{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 84px);width:min(92vw,360px);transform:translateX(-50%);z-index:8;pointer-events:none;border-radius:18px;padding:16px 14px 14px;border:2px solid var(--gold);background:linear-gradient(180deg,#123a24f4,#0a1c14f4);box-shadow:0 14px 40px #000c,0 0 0 100vmax #0000004d;animation:glin .22s ease-out backwards}
.gl.them{border-color:var(--red);background:linear-gradient(180deg,#3a1219f4,#1c0a0ef4)}
.gl.out{opacity:0;transition:opacity .35s}
.gl-goal{position:relative;height:110px;width:80%;margin:14px auto 0;border:4px solid #f4f7f4;border-bottom:none;border-radius:5px 5px 0 0;background:repeating-linear-gradient(0deg,#ffffff26 0 1px,transparent 1px 10px),repeating-linear-gradient(90deg,#ffffff26 0 1px,transparent 1px 10px),#08121b;animation:glnet .4s .5s ease-out}
.gl-ground{height:10px;border-radius:0 0 8px 8px;background:repeating-linear-gradient(90deg,#1a7434 0 12.5%,#14612c 12.5% 25%)}
.gl-ball{position:absolute;left:var(--bx);top:34%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#d9dfe2 55%,#8f9ba2);box-shadow:0 2px 6px #0009;animation:glball .55s cubic-bezier(.2,.75,.3,1) backwards}
.gl-ball:after{content:'';position:absolute;inset:-4px;border-radius:50%;border:2px solid #fff;opacity:0;animation:glring .6s .5s ease-out}
.gl-gk{position:absolute;bottom:0;left:var(--kx);width:15px;height:44px;margin-left:-7px;border-radius:7px 7px 3px 3px;background:var(--gkc);transform:rotate(var(--kr));animation:glgk .45s .15s ease-out backwards}
.gl-gk:before{content:'';position:absolute;top:-11px;left:1px;width:13px;height:13px;border-radius:50%;background:#f1c9a5}
.gl-txt{text-align:center;margin-top:12px}
.gl-txt b{display:block;font-size:36px;font-weight:900;color:var(--gold);text-shadow:0 3px 0 #7a5300,0 0 22px #f2b63277;animation:glpop .5s .5s cubic-bezier(.2,1.6,.4,1) backwards}
.gl.them .gl-txt b{font-size:26px;color:#ff7a8a;text-shadow:0 2px 0 #5a0d18}
.gl-txt span{display:block;font-size:15px;margin-top:2px;color:#fff}.gl-txt small{display:block;font-size:12px;color:var(--dim);margin-top:2px}
.gl .cf{position:absolute;left:50%;top:62%;width:7px;height:11px;border-radius:2px;background:var(--c);opacity:0;animation:glcf .95s .5s ease-out backwards}
@keyframes glin{from{opacity:0;transform:translateX(-50%) scale(.9)}}
@keyframes glball{from{left:50%;top:150%;transform:scale(.35)}}
@keyframes glgk{from{left:50%;transform:rotate(0)}}
@keyframes glnet{40%{transform:scale(1.04,1.08)}}
@keyframes glring{from{opacity:.9;transform:scale(.6)}to{opacity:0;transform:scale(3)}}
@keyframes glpop{from{transform:scale(0) rotate(-8deg);opacity:0}}
@keyframes glcf{from{opacity:1;transform:translate(0,0) rotate(0)}to{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--rt))}}

/* ===== v24: شعارات الأندية ===== */
.bdg{vertical-align:middle;flex:none;filter:drop-shadow(0 2px 3px #0008)}
.hdn{display:flex;align-items:center;gap:8px}
.hero .vs b.tm{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;text-align:center;font-size:16px;line-height:1.3}
td .bdg{margin-left:6px}.sbm .bdg{margin:0 4px}
.gl-crest{position:absolute;top:10px;right:12px}

/* ===== v25: ملعب أجمل ===== */
.pitch{height:176px!important;border-radius:14px!important;border:2px solid #ffffff55!important;box-shadow:inset 0 0 40px #000a,0 6px 18px #0009;background:radial-gradient(circle at 50% 50%,transparent 15%,#fff5 15.5%,#fff5 17%,transparent 17.5%),linear-gradient(90deg,transparent 49.6%,#fff6 49.6%,#fff6 50.4%,transparent 50.4%),radial-gradient(ellipse at 50% 40%,#ffffff22,transparent 70%),repeating-linear-gradient(90deg,#1b6a28 0 8.33%,#238233 8.33% 16.66%)!important}
.dl{position:absolute;inset:0}
.pl{width:11px;height:11px;border:1.5px solid #fff9;box-shadow:0 2px 4px #0009}
.pa{background:radial-gradient(circle at 35% 30%,#8fcaff,#1e88e5)}.pb{background:radial-gradient(circle at 35% 30%,#ff9a92,#d32f2f)}
.bl{width:13px!important;height:13px!important;margin:-1px 0 0 -6px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#cfd6da 60%,#8f9ba2)!important;box-shadow:0 0 0 3px #ffffff40,0 3px 8px #000b;transition:left .55s ease-in-out,top .55s ease-in-out}
.mom{height:8px;border-radius:4px;overflow:hidden}.mom i{display:block;height:100%;background:linear-gradient(90deg,#2fb36d,#f2b632);transition:width .5s}

/* ===== v26: ركلات ثابتة تفاعلية + إعادة الهدف ===== */
.pw{position:relative;height:22px;border-radius:11px;margin:16px 4px 6px;background:linear-gradient(90deg,#e53935 0 35%,#f2b632 35% 58%,#2fb36d 58% 82%,#f2b632 82% 92%,#e53935 92%)}
.pw u{position:absolute;top:-5px;left:0;width:6px;height:32px;margin-left:-3px;border-radius:3px;background:#fff;box-shadow:0 0 6px #000}
.gl-ball.up{top:-24%}
.gl.save,.gl.miss{border-color:#4aa3e8;background:linear-gradient(180deg,#10283bf4,#08141df4)}
.gl.save .gl-txt b,.gl.miss .gl-txt b{font-size:28px;color:#7cc2f0;text-shadow:0 2px 0 #123}
.gl-rp{margin-top:10px;border-radius:8px;overflow:hidden;border:1px solid #ffffff30;position:relative}
.gl-rp svg{display:block;width:100%;height:auto}.gl-rp small{position:absolute;top:3px;right:6px;font-size:10px;color:#fff;background:#0009;padding:1px 6px;border-radius:6px}

/* ===== v27: صفات اللاعبين وقصة الموسم ===== */
.trt{display:inline-block;margin-right:6px;font-size:11px;padding:1px 8px;border-radius:9px;background:#ffffff18;color:var(--gold);vertical-align:middle}
.stov{position:fixed;inset:0;z-index:11;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 18px) 14px 28px;background:radial-gradient(120% 60% at 50% 0,#14402a,#0b141d 70%)}
.stc{max-width:420px;margin:0 auto}.st-top{display:flex;gap:12px;align-items:center}.st-top h2{margin:2px 0;font-size:22px;color:var(--gold)}.st-top small{color:var(--dim);display:block}
.st-chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0}.st-chips div{background:#0d1822;border:1px solid var(--line);border-radius:12px;padding:10px 2px;text-align:center}.st-chips b{display:block;font-size:20px}.st-chips small{font-size:11px;color:var(--dim)}
.st-p{line-height:1.9;font-size:15px;background:#ffffff0d;border-right:4px solid var(--gold);padding:10px 12px;border-radius:10px;margin:0 0 12px}
.st-l div{padding:9px 2px;border-bottom:1px solid var(--line);font-size:14px}
.st-b{max-width:420px;margin:16px auto 0;display:flex;gap:8px}.st-b button{flex:1;margin:0}

/* ===== v28: صوت وجماهير ===== */
#sb{position:relative}.snb{position:absolute;top:4px;left:6px;background:#ffffff14;border:none;border-radius:10px;padding:4px 9px;font-size:15px;color:#fff;z-index:2}
</style>
</head>
<body>
<div class="header">
  <h1><span class="hdn"><span id="crest">⚽</span><span id="clubName">مدير كرة القدم</span></span><span id="season" class="dim"></span></h1>
  <div class="stats"><span>💰 <span id="budget">0</span></span><span>🏛️ الثقة: <span id="conf">0%</span></span><span>📅 <span id="date">-</span></span></div>
  <div class="cbar"><i id="cbar"></i></div>
</div>
<div id="sb"></div>
<div id="console" role="log" aria-live="polite" aria-relevant="additions" aria-label="أحداث المباراة"></div>
<div id="ctl"><div class="grid">
<button class="cb" id="bp" onclick="togPause()">⏸ إيقاف</button>
<button class="cb" onclick="subMenu()">🔄 تبديل (<span id="sl">5</span>)</button>
<button class="cb" onclick="tacMenu()">🎯 تكتيك</button>
<button class="cb" onclick="ordBtn()">🧠 أوامر</button>
<button class="cb" onclick="ratBtn()">📋 تقييم</button>
<button class="cb" id="bs" onclick="speed()">⏩ x1</button>
<button class="cb" onclick="skipMatch()">⏭ تخطي</button></div></div>
<div id="content"></div>
<div class="nav-bar">
  <button class="nav-btn active" data-tab="home" onclick="go('home')"><span>🏠</span>الرئيسية</button>
  <button class="nav-btn" data-tab="squad" onclick="go('squad')"><span>👥</span>الفريق</button>
  <button class="nav-btn" data-tab="train" onclick="go('train')"><span>🏋️</span>التدريب</button>

function pot(p){if(p.pot===undefined)p.pot=cl(p.ovr+(p.age<24?R(3,9):p.age<28?R(1,4):R(0,1)),p.ovr,94);if(p.pot<p.ovr)p.pot=p.ovr;return p.pot}

function trainWeek(){let t=TR(),I=INT[t.lv],ups=[];if(I.c&&!financePost('s'+G.season+':r'+(G.round+1)+':training','training','تكلفة التدريب الأسبوعي',-I.c)){log('⚠️ تعذّر تسجيل تكلفة التدريب؛ تم تجاوز تدريب هذا الأسبوع','log-bad');return;}

    if(t.lv==2&&!p.inj&&Math.random()<.01){p.inj=R(1,3);log(`🚑 ${p.name} أُصيب في التدريب المكثف (${p.inj} أسابيع)`,'log-bad')}

  log(`🏋️ التدريب (${I.n})${I.c?' -'+money(I.c):''}${ups.length?' | 📈 تطور: '+ups.join('، '):''}`,'log-goal')}

function genObj(){let U=G.uid,r=G.clubs.filter(c=>c.dv==C(U).dv).map(c=>({id:c.id,pw:teamS(c.id).pw})).sort((a,b)=>b.pw-a.pw).findIndex(x=>x.id==U)+1;
  let yg=Math.max(0,...G.players.filter(p=>p.clubId==U&&p.age<=22).map(p=>p.ovr));

  G.exp=r;G.obj=[{k:'rank',t:cl(r-1,2,7),rw:360000,cf:10},{k:'wins',t:cl(10-r,4,9),rw:180000,cf:3},...ex];G.st={cs:0,best:0,cur:0}}
function otxt(o){return({rank:`إنهاء الموسم ضمن أول ${o.t}`,wins:`تحقيق ${o.t} انتصارات`,goals:`تسجيل ${o.t} هدفاً`,cs:`${o.t} مباريات دون استقبال أهداف`,
  streak:`سلسلة ${o.t} مباريات دون خسارة`,youth:`لاعب عمره ≤22 يصل لمستوى ${o.t}`,budget:`ختم الموسم بميزانية ≥ ${money(o.t)}`})[o.k]}
function objCur(o){let c=C(G.uid),s=G.st||{cs:0,best:0},y=Math.max(0,...G.players.filter(p=>p.clubId==G.uid&&p.age<=22).map(p=>p.ovr));

  return `<div class="row"><span>${o.k=='rank'?'📍':met(o)?'✅':'⏳'} ${otxt(o)}<br><span class="dim">الحالي: ${t} • المكافأة ${money(o.rw)} + ${o.cf}% ثقة${o.k=='rank'?' • الفشل -10% ثقة':''}</span></span></div>`}).join('')}

  (G.obj||[]).forEach((o,i)=>{let ok=met(o),paid=false;if(ok){paid=financePost('s'+G.season+':management-objective:'+i,'management-prize','مكافأة هدف الإدارة: '+otxt(o),o.rw);if(paid)G.conf=cl(G.conf+o.cf,0,100)}else if(o.k=='rank')G.conf=cl(G.conf-10,0,100);
    h+=`<br>${ok?(paid?'✅':'⚠️'):'❌'} ${otxt(o)}${paid?' (+'+money(o.rw)+')':ok?' (تعذّر تسجيل المكافأة)':''}`});return h}
const CN=['ربع النهائي','نصف النهائي','النهائي'];
function newCup(){let i=G.clubs.filter(c=>c.dv==C(G.uid).dv).map(c=>c.id).sort(()=>Math.random()-.5);G.cup={s:0,pairs:[[i[0],i[1]],[i[2],i[3]],[i[4],i[5]],[i[6],i[7]]],lg:[],due:false,done:false}}
function simCup(a,b){let s=teamS(a),t=teamS(b),[x,y]=quickGoals(s,t,true);
  if(x==y){let w=Math.random()<.5+(s.pw-t.pw)/60;return{w:w?a:b,l:`${C(a).name} ${x}-${y} ${C(b).name} (ركلات)`}}
  return{w:x>y?a:b,l:`${C(a).name} ${x}-${y} ${C(b).name}`}}
function cupAdvance(ur){let c=G.cup;if(!c||c.done)return;let U=G.uid,ws=[],roundLogs=[];
  c.pairs.forEach(p=>{if(ur&&p.includes(U)){ws.push(ur.w?U:(p[0]==U?p[1]:p[0]));roundLogs.push(CN[c.s]+': '+ur.l)}else{let r=simCup(p[0],p[1]);ws.push(r.w);roundLogs.push(CN[c.s]+': '+r.l)}});
  if(c.s+1>=3){const inF=c.pairs[0].includes(U);if(ws[0]===U&&!financePostRecorded('s'+G.season+':cup:champion','cup-prize','مكافأة الفوز بكأس تونس',600000))return;if(ws[0]!==U&&inF&&!financePostRecorded('s'+G.season+':cup:runner-up','cup-prize','مكافأة وصافة كأس تونس',150000))return}
  c.lg.push(...roundLogs);c.due=false;c.s++;
  if(c.s>=3){c.done=true;c.champ=ws[0];let inF=c.pairs[0].includes(U);
    if(ws[0]==U){G.conf=cl(G.conf+15,0,100);c.msg='🏆 توّجت بكأس تونس! +600k و+15% ثقة'}
    else{if(inF){c.msg='🥈 وصيف الكأس +150k'}else c.msg='بطل الكأس: '+C(ws[0]).name}
    G.news.push(c.msg)}
  else{c.pairs=[];for(let i=0;i<ws.length;i+=2)c.pairs.push([ws[i],ws[i+1]])}}
function cupCheck(){let c=G.cup;if(!c||c.done)return;
  if(G.round>=4+4*c.s){if(c.pairs.some(p=>p.includes(G.uid))){c.due=true;G.news.push('🏆 مباراة الكأس ('+CN[c.s]+') قبل الجولة التالية')}else cupAdvance(null)}}
function cupRow(){let c=G.cup;if(!c)return'';return `<div class="row"><span>🏆 الكأس:</span><span class="hl">${c.done?(c.champ==G.uid?'بطل!':'انتهت'):c.due?'مباراتك: '+CN[c.s]:c.pairs.some(p=>p.includes(G.uid))?'في '+CN[c.s]:'خرجت'}</span></div>`}
function cupBtn(){let c=G.cup;if(c&&c.due){let pr=c.pairs.find(p=>p.includes(G.uid)),o=C(pr[0]==G.uid?pr[1]:pr[0]);

  return '<button class="action-btn" onclick="startMatch()">⚽ خوض المباراة</button>'}
function cupTab(){let c=G.cup;if(!c)return'';let h='<h3 class="title" style="margin-top:16px">🏆 كأس تونس</h3>'+c.lg.map(x=>`<div class="row dim">${x}</div>`).join('');
  if(!c.done)h+=`<div class="row"><span class="hl">القادم: ${CN[c.s]}</span></div>`+c.pairs.map(p=>`<div class="row"><span>${badge(p[0],16)} ${C(p[0]).name} × ${C(p[1]).name} ${badge(p[1],16)}</span></div>`).join('');
  else h+=`<div class="row"><span class="hl">${c.champ==G.uid?'🏆 أنت البطل':'البطل: '+C(c.champ).name}</span></div>`;return h}
function soStart(){M.so={u:0,o:0,n:0,ph:0};log('🥅 ركلات الترجيح! الأعصاب مشدودة...','log-info');soKick()}
function soKick(){M.so.ph=0;sb();if(M.skip)return soRes(R(0,2));
  menu(`🥅 ركلتك رقم ${M.so.n+1} (${M.so.u}-${M.so.o}) — اختر اتجاه التسديدة`,DIRS.map((d,i)=>({l:d,fn:()=>soRes(i)})),false)}
function soRes(d){let g=kick(d,rdir());if(g)M.so.u++;log(`${scorer(M.xi)} يسدد ${DIRS[d]}: ${g?'هدف ⚽':'مصدودة 🧤'}`,g?'log-goal':'log-bad');soOpp()}
function soOpp(){M.so.ph=1;sb();if(M.skip)return soRes2(R(0,2));
  menu(`الخصم يسدد (${M.so.u}-${M.so.o}) — اختر اتجاه حارسك`,DIRS.map((d,i)=>({l:d,fn:()=>soRes2(i)})),false)}
function soRes2(kd){let g=kick(rdir(),kd);if(g)M.so.o++;log(`${scorer(M.O.xi)} يسدد: ${g?'هدف للخصم ⚽':'حارسك يتصدى 🧤'}`,g?'log-bad':'log-goal');M.so.n++;
  let t=M.so,rem=5-t.n;
  if((t.n>=5&&t.u!=t.o)||(t.n<5&&(t.u>t.o+rem||t.o>t.u+rem))){M.pen=[t.u,t.o];M.cupWin=t.u>t.o;M.so=null;M.done=true;clearInterval(M.t);motm();endCup()}
  else soKick()}
function endCup(){let U=G.uid,c=G.cup,opp=M.opp,h=M.home,w=M.gu>M.go||(M.gu==M.go&&M.cupWin);
  let pn=M.pen?` (ركلات ${h?M.pen[0]+'-'+M.pen[1]:M.pen[1]+'-'+M.pen[0]})`:'';
  let l=(h?`${C(U).name} ${M.gu}-${M.go} ${opp.name}`:`${opp.name} ${M.go}-${M.gu} ${C(U).name}`)+pn;
  log(`📊 استحواذ ${Math.round(M.ps/M.min)}% | تسديدات ${M.sh[0]}-${M.sh[1]}${M.sc.length?' | الأهداف: '+M.sc.join('، '):''}`,'log-info');
  log(`\n🏁 ${CN[c.s]}: ${M.gu}-${M.go}${M.pen?' (ركلات الترجيح '+M.pen[0]+'-'+M.pen[1]+')':''} — ${w?'تأهلت! 🎉':'ودّعت الكأس 😞'}`,'log-info');
  let gate=50000+(w?30000:0);if(financePost('s'+G.season+':cup:'+c.s+':gate','cup-income','مداخيل مباراة الكأس',gate))log('💰 مداخيل الكأس '+money(gate),'log-goal');else log('⚠️ تعذّر تسجيل مداخيل مباراة الكأس','log-bad');
  G.conf=cl(G.conf+(w?3:-2),0,100);

  if(M.derby){G.fan=cl(G.fan+(w?5:-6),0,100);G.conf=cl(G.conf+(w?4:-4),0,100);G.news.push(`🔥 ${M.derby} (الكأس): ${l}`);log(`🔥 ${M.derby}: ${w?'انتصار تاريخي يشعل المدرجات! (+4% ثقة)':'خروج موجع من الكأس في الديربي (-4% ثقة)'}`,w?'log-goal':'log-bad')}
  if(h&&!w&&G.fan<25){G.conf=cl(G.conf-2,0,100);G.news.push('الجماهير غاضبة وتهتف ضد المدرب بعد الخروج من الكأس');log('📣 الجماهير غاضبة عند صافرة النهاية! (-2% ثقة)','log-bad')}
  let ld=M.xi.some(x=>trt(x)=='leader');
  G.players.forEach(p=>{if(p.clubId==U){p.morale=cl(p.morale+(w?4:-4+(ld?2:0))-(trt(p)=='hot'&&!p.inj&&!M.xi.includes(p)?2:0),30,100);if(!p.inj&&Math.random()<.015*(trt(p)=='fragile'?2.2:1)){p.inj=R(1,4);log(`🚑 إصابة ${p.name} (${p.inj} أسابيع)`,'log-bad')}}});
  pressAfter(w?'win':'loss',M.gu,M.go,opp,true);cupAdvance({w,l});G.date+=3*864e5;if(c.done)log(c.msg,'log-goal');
  sb();save();clearMatchSession();busy=false;M=null;shadowMonitor=null;document.body.classList.remove('match-live');hdr();$('ctl').style.display='none';
  $('content').style.display='block';$('content').innerHTML=`<button class="action-btn" onclick="go('home')">متابعة</button>`;setTimeout(lockerEvent,700)}
const ST=p=>p.st||(p.st={g:0,a:0,ap:0,rs:0,mo:0});

  if(busy){say('المباراة جارية، انتظر نهايتها أو اضغط تخطي.');return}snd.stop();
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab==t));
  $('console').style.display='none';$('ctl').style.display='none';$('sb').style.display='none';
  const c=$('content');c.style.display='block';hdr();
  if(G.conf<=0){if(!G.fired)fireNow();c.innerHTML=jobsHtml(true);return}
  const U=G.uid,mine=()=>G.players.filter(p=>p.clubId==U);
  if(t=='press'){c.innerHTML=pressHtml();return}
  if(t=='home'){
    let pr=G.fix[G.round].find(x=>x.includes(U)),home=pr[0]==U,opp=C(home?pr[1]:pr[0]),rk=table().findIndex(x=>x.id==U)+1;
    let wk=mine().reduce((s,p)=>s+wg(p),0)+ACW[AC().lv]+SDU[SD().cap];
    const wr=rk>=7&&C(U).dv==1,pr_=rk<=2&&C(U).dv==2;
    c.innerHTML=`<div class="hero"><div class="dim">الجولة ${G.round+1} / 14 • ${home?'🏟️ على أرضك':'✈️ خارج الأرض'}${isDerby(C(U).name,opp.name)?' • <b style="color:#ff6b7d">🔥 '+isDerby(C(U).name,opp.name)+'</b>':''}</div>
    <div class="vs"><b class="tm">${badge(home?C(U):opp,54)}<span>${home?C(U).name:opp.name}</span></b><i>×</i><b class="tm">${badge(home?opp:C(U),54)}<span>${home?opp.name:C(U).name}</span></b></div>${cupBtn()}</div>
    <div class="chips">
      <div class="chip ${wr?'bad':pr_?'good':''}"><small>الترتيب</small><b>${rk}</b><small>${DVN[C(U).dv]}${wr?' ⚠️':pr_?' 🔼':''}</small></div>
      <div class="chip"><small>التكتيك</small><b>${TAC[G.tactic]}</b><small>${G.form}</small></div>
      <div class="chip"><small>أجور/أسبوع</small><b class="loss">${money(wk)}</b><small>${INT[TR().lv].n}${TR().focus?' • '+POS[TR().focus]:''}</small></div>
    </div>
    <button class=\"action-btn alt\" style=\"margin:0 0 8px\" onclick=\"scoutReport()\">🔍 تقرير المساعد عن الخصم</button>${cupRow()}${expRow()}${acRow()}${ofRow()}${jobRow()}
    <div class="row"><span>📣 مزاج الجماهير:</span><span style="color:${fan()>=65?'#43c47d':fan()<40?'#ff6b7d':'inherit'}">${fanTxt()}</span></div>
    <div class="row"><span>الرعاية:</span><span>${G.sponsor?`${G.sponsor.n} (+${money(G.sponsor.w)}/أسبوع، باقي ${G.sponsor.k})`:'لا يوجد'}</span></div>
    ${G.sponsor?'':SP.map((s,i)=>`<button class="action-btn gold" onclick="sign(${i})">💼 ${s.n}: ${money(s.w)}/أسبوع × ${s.k} (+${money(s.b)})</button>`).join('')}
    <div class="three"><button class="action-btn alt" onclick="go('stadium')">🏟️ الاستاد</button><button class="action-btn alt" onclick="go('career')">🧳 مسيرتك</button><button class="action-btn alt" onclick="go('press')">📰 الصحافة${(PRS().q?1:0)+PRS().r.length?' ('+((PRS().q?1:0)+PRS().r.length)+')':''}</button></div>
    <h3 class="title" style="margin-top:16px">🎯 أهداف الإدارة لهذا الموسم</h3>${objRows()}
    ${G.news.length?'<h3 class="title" style="margin-top:16px">آخر الأخبار</h3>'+G.news.slice(-6).reverse().map(n=>`<div class="row dim">${n}</div>`).join(''):''}
    <button class="action-btn" style="background:#555" onclick="resetGame()">🔄 لعبة جديدة</button>`;
  }else if(t=='squad'){
    const xi=teamS(U).xi.map(p=>p.id),ord=['GK','DEF','MID','FWD'];
    const l=mine().sort((a,b)=>ord.indexOf(a.pos)-ord.indexOf(b.pos)||b.ovr-a.ovr);
    const totalWage=l.reduce((sum,p)=>sum+wg(p),0);
    const groups=ord.map(pos=>{
      const players=l.filter(p=>p.pos===pos);
      if(!players.length)return '';
      return `<section class="squad-group" data-squad-group="${pos}">
        <header><b>${uiEsc(POS[pos])}</b><span>${players.length} لاعب</span></header>
        <div class="squad-grid">${players.map(p=>{
          const starter=xi.includes(p.id),injured=!!p.inj;
          return `<article class="squad-player ${starter?'is-starter':''} ${injured?'is-injured':''}">
            <div class="squad-player-top"><span class="squad-position">${uiEsc(POS[p.pos])}</span><strong class="ovr ${ovc(p.ovr)}">${p.ovr}</strong></div>
            <h3>${uiEsc(p.name)}</h3>
            <div class="squad-player-tags">${starter?'<span class="squad-tag starter">أساسي</span>':'<span class="squad-tag">احتياط</span>'}${injured?'<span class="squad-tag injured">🚑 مصاب • '+p.inj+' أسابيع</span>':''}${p.morale<50?'<span class="squad-tag low-morale">معنويات منخفضة</span>':''}</div>
            <div class="squad-player-metrics">
              <span><small>العمر</small><b>${p.age}</b></span><span><small>الإمكانات</small><b>${pot(p)}</b></span><span><small>المعنويات</small><b>${p.morale}%</b></span>
              <span><small>الأهداف</small><b>${ST(p).g}</b></span><span><small>التمريرات الحاسمة</small><b>${ST(p).a}</b></span><span><small>العقد</small><b>${cy(p)} سنة</b></span>
            </div>
            ${p.pos==='GK'?'<div class="squad-keeper">🧤 رد الفعل '+(p.gkReflexes??p.ovr)+' • الإمساك '+(p.gkHandling??p.ovr)+' • التمركز '+(p.gkPositioning??p.ovr)+' • الانفراد '+(p.gkOneOnOne??p.ovr)+' • التوزيع '+(p.gkDistribution??p.ovr)+'</div>':''}
            <div class="squad-player-footer"><span>القيمة <b>${money(val(p))}</b></span><span>الراتب <b>${money(wg(p))}/أسبوع</b></span></div>
            <div class="squad-player-actions"><button type="button" class="squad-sell" data-sell-player="${uiEsc(p.id)}">بيع اللاعب</button><button type="button" class="squad-sell" data-loan-player="${uiEsc(p.id)}">إعارة</button></div>
          </article>`;
        }).join('')}</div>
      </section>`;
    }).join('');
    c.innerHTML=`<div class="squad-heading"><div><h2 class="title">قائمة الفريق</h2><p class="dim">إدارة اللاعبين ومراجعة حالتهم الفنية والمالية</p></div><strong class="squad-count">${l.length}<small>/26</small></strong></div>
      <div class="squad-summary"><div><small>عدد اللاعبين</small><b>${l.length}/26</b></div><div><small>التشكيلة الأساسية</small><b>${xi.length}/11</b></div><div><small>الأجور الأسبوعية</small><b>${money(totalWage)}</b></div></div>
      <div class="squad-shortcuts">
        <button class="action-btn" onclick="go('lineup')">👥 التشكيلة الأساسية</button><button class="action-btn" onclick="go('stats')">📊 الإحصائيات والجوائز</button>
        <button class="action-btn" onclick="go('contracts')">📝 العقود والرواتب</button><button class="action-btn" onclick="go('loans')">🔁 الإعارات</button><button class="action-btn" onclick="go('academy')">🎓 أكاديمية الشباب</button>
        <button class="action-btn" onclick="traitHelp()">🧬 صفات اللاعبين</button><button class="action-btn" onclick="storyList()">📖 قصص المواسم</button>
      </div>
      <div class="squad-filters" role="group" aria-label="تصفية اللاعبين حسب المركز">
        <button type="button" class="squad-filter active" data-squad-filter="ALL" aria-pressed="true">الكل</button>
        ${ord.map(pos=>`<button type="button" class="squad-filter" data-squad-filter="${pos}" aria-pressed="false">${uiEsc(POS[pos])}</button>`).join('')}
      </div>
      ${groups||'<p class="squad-empty">لا يوجد لاعبون في الفريق حالياً.</p>'}`;
    c.querySelectorAll('[data-squad-filter]').forEach(button=>button.addEventListener('click',()=>{
      const filter=button.dataset.squadFilter;
      c.querySelectorAll('[data-squad-filter]').forEach(item=>{const active=item===button;item.classList.toggle('active',active);item.setAttribute('aria-pressed',String(active))});
      c.querySelectorAll('[data-squad-group]').forEach(group=>group.hidden=filter!=='ALL'&&group.dataset.squadGroup!==filter);
    }));
    c.querySelectorAll('[data-sell-player]').forEach(button=>button.addEventListener('click',()=>sell(button.dataset.sellPlayer)));
     c.querySelectorAll('[data-loan-player]').forEach(button=>button.addEventListener('click',()=>loanPlayer(button.dataset.loanPlayer)));
  }else if(t=='tactics'){
    const s=teamS(U),formation=FORM[G.form]||FORM['4-4-2'];
    const injured=s.xi.filter(p=>p.inj),outOfPosition=s.xi.filter(p=>s.sl[p.id]!==p.pos);
    const missing=Math.max(0,11-s.xi.length);
    const warnings=[];
    if(missing)warnings.push('ينقص التشكيل '+missing+' لاعباً لإكمال 11 لاعباً');
    if(injured.length)warnings.push(injured.length+' لاعباً مصاباً ضمن التشكيلة');
    if(outOfPosition.length)warnings.push(outOfPosition.length+' لاعباً خارج مركزه الطبيعي');
    const warningsHtml=warnings.length
      ? '<section class="tactics-warnings" role="status"><b>⚠️ تنبيهات التشكيلة</b><ul>'+warnings.map(w=>'<li>'+uiEsc(w)+'</li>').join('')+'</ul><button type="button" class="action-btn" data-open-lineup>مراجعة التشكيلة</button></section>'
      : '<p class="tactics-ready">✓ التشكيلة الحالية مكتملة ولا تظهر إصابات أو مراكز غير مطابقة.</p>';
    c.innerHTML=`<div class="tactics-heading"><div><h2 class="title">🎯 مركز التكتيك</h2><p class="dim">إدارة أسلوب اللعب والخطة قبل المباراة</p></div><span class="tactics-current">${TAC[G.tactic]||TAC.balanced}</span></div>
      <section class="tactics-strength" aria-label="مؤشرات قوة التشكيلة">
        <div class="tactics-strength-main"><small>قوة التشكيلة الأساسية</small><b>${s.pw.toFixed(1)}</b><span>من تقييم اللاعبين الحالي</span></div>
        <div class="tactics-strength-side"><div><span>⚔️ الهجوم</span><b>${s.a.toFixed(1)}</b></div><div><span>🛡️ الدفاع</span><b>${s.d.toFixed(1)}</b></div></div>
      </section>
      <section class="tactics-section"><header><b>أسلوب اللعب</b><small>اختر توجه الفريق</small></header>
        <div class="tactics-style-grid">${Object.keys(TAC).map(k=>`<button type="button" class="tactics-style ${G.tactic==k?'active':''}" data-tactic-choice="${k}" aria-pressed="${G.tactic==k}"><b>${k==='attacking'?'⚔️':k==='defensive'?'🛡️':'⚖️'} ${TAC[k]}</b><small>${k==='attacking'?'زيادة القوة الهجومية مقابل تراجع دفاعي':k==='defensive'?'تعزيز الدفاع مقابل تراجع هجومي':'توازن بين الهجوم والدفاع'}</small></button>`).join('')}</div>
      </section>
      <section class="tactics-section"><header><b>الخطة الأساسية</b><small>توزيع اللاعبين حسب المراكز</small></header>
        <div class="tactics-formation-grid">${Object.keys(FORM).map(k=>`<button type="button" class="tactics-formation ${G.form==k?'active':''}" data-formation-choice="${k}" aria-pressed="${G.form==k}"><b>${k}</b><span>${FORM[k][1]} دفاع • ${FORM[k][2]} وسط • ${FORM[k][3]} هجوم</span></button>`).join('')}</div>
        <div class="tactics-shape" aria-label="توزيع الخطة المختارة">
          <span class="tactics-shape-goal">🥅</span><div class="tactics-shape-row"><b>${formation[3]}</b><span>هجوم</span></div><div class="tactics-shape-row"><b>${formation[2]}</b><span>وسط</span></div><div class="tactics-shape-row"><b>${formation[1]}</b><span>دفاع</span></div><div class="tactics-shape-row"><b>1</b><span>حارس</span></div>
        </div>
      </section>
      ${warningsHtml}
      <button type="button" class="action-btn gold tactics-lineup-action" data-open-lineup>👥 إدارة التشكيلة الأساسية${G.lu&&G.lu.p.length?' • مخصّصة':''}</button>
      <p class="tactics-footnote">المؤشرات مبنية على بيانات الفريق الحالية. تغيير الخطة أو الأسلوب يحفظ اختيارك، ولا يغيّر نتيجة مباراة سابقة.</p>`;
    c.querySelectorAll('[data-tactic-choice]').forEach(button=>button.addEventListener('click',()=>setT(button.dataset.tacticChoice)));
    c.querySelectorAll('[data-formation-choice]').forEach(button=>button.addEventListener('click',()=>setF(button.dataset.formationChoice)));
    c.querySelectorAll('[data-open-lineup]').forEach(button=>button.addEventListener('click',()=>go('lineup')));
  }else if(t=='table'){
    const tb=dv=>{let d=C(U).dv,l=table(dv),n=l.length;return `<h2 class="title">${DVN[dv]}${dv==d?' (دوريك)':''}</h2><table><tr><th>#</th><th>الفريق</th><th>لعب</th><th>ف</th><th>ت</th><th>خ</th><th>فارق</th><th>نقاط</th></tr>`+
      l.map((x,i)=>`<tr class="${x.id==U?'me':''}" style="${dv==1&&i>=n-2?'border-right:3px solid var(--red)':dv==2&&i<2?'border-right:3px solid var(--pr)':''}"><td>${i+1}</td><td>${badge(x,18)}${x.name}</td><td>${x.p}</td><td>${x.w}</td><td>${x.d}</td><td>${x.l}</td><td>${x.gf-x.ga}</td><td>${x.pts}</td></tr>`).join('')+'</table>'};
    let d0=C(U).dv;c.innerHTML=tb(d0)+'<p class="dim">🟢 الأول والثاني في الثانية يصعدان • 🔴 آخر فريقين في الأولى يهبطان</p>'+cupTab()+'<div style="margin-top:16px"></div>'+tb(d0==1?2:1);
  }else if(t=='lineup'){
    let S=teamS(U),A=strength(U,G.tactic,G.form,true),f=FORM[G.form],ordp=['GK','DEF','MID','FWD'];
    const groups=ordp.map((pos,i)=>{
      const players=S.xi.filter(p=>S.sl[p.id]==pos);
      return `<section class="lineup-line lineup-line-${pos.toLowerCase()}">
        <header><b>${POS[pos]}</b><span>${players.length} / ${f[i]}</span></header>
        <div class="lineup-players">${players.map(p=>`<button type="button" class="lineup-player" data-position="${pos}" data-player-id="${uiEsc(p.id)}" aria-label="تبديل ${uiEsc(p.name)}">
          <span class="lineup-player-rating">${p.ovr}</span><b>${uiEsc(p.name)}</b>
          <small>${p.pos!=pos?'⚠️ خارج المركز • ':''}${p.morale}% معنويات ${p.inj?'• 🚑 مصاب':''}</small>
        </button>`).join('')}</div>
      </section>`;
    }).reverse().join('');
    const bench=mine().filter(p=>!S.xi.includes(p)).sort((a,b)=>b.ovr-a.ovr);
    const warnings=S.xi.filter(p=>p.inj||p.pos!=S.sl[p.id]);
    c.innerHTML=`<button class="action-btn lineup-back" onclick="go('tactics')">⬅️ العودة للتكتيك</button>
      <div class="lineup-heading"><div><h2 class="title">👥 التشكيلة الأساسية</h2><p class="dim">الخطة ${uiEsc(G.form)} • اختر لاعباً لتغييره ببديل من المركز نفسه</p></div><span class="lineup-count">${S.xi.length}/11</span></div>
      <div class="lineup-kpis">
        <div><small>قوة التشكيلة الحالية</small><b>${S.pw.toFixed(1)}</b></div>
        <div><small>القوة التلقائية</small><b>${A.pw.toFixed(1)}</b></div>
        <div><small>الاحتياط</small><b>${bench.length}</b></div>
      </div>
      <div class="lineup-pitch" aria-label="مخطط التشكيلة على أرض الملعب">
        <div class="lineup-pitch-half"></div><div class="lineup-pitch-circle"></div><div class="lineup-pitch-box lineup-pitch-box-top"></div><div class="lineup-pitch-box lineup-pitch-box-bottom"></div>
        ${groups}
      </div>
      ${warnings.length?`<div class="lineup-alert">⚠️ ${warnings.length} ملاحظة: راجع اللاعبين المصابين أو الذين يلعبون خارج مراكزهم.</div>`:''}
      <div class="lineup-actions"><button class="action-btn" onclick="luAuto()">🤖 استعادة التشكيلة التلقائية</button></div>
      <section class="lineup-bench"><header><b>دكة البدلاء</b><span>${bench.length} لاعب</span></header>
        ${bench.length?bench.map(p=>`<div class="lineup-bench-player"><span><b>${uiEsc(p.name)}</b><small>${POS[p.pos]} • ${p.morale}% معنويات ${p.inj?'• 🚑 مصاب':''}</small></span><strong>${p.ovr}</strong></div>`).join(''):'<p class="dim">لا يوجد لاعبون احتياط حالياً.</p>'}
      </section>
      <p class="lineup-footnote">يُستبدل اللاعب ببديل سليم من المركز نفسه فقط. اللاعب المصاب لا يبدأ تلقائياً. لا تتغير نتائج المباريات بسبب طريقة العرض هذه.</p>`;
    c.querySelectorAll('.lineup-player').forEach(button=>button.addEventListener('click',()=>luPick(button.dataset.position,button.dataset.playerId)));
  }else if(t=='career'){
    let co=CO();c.innerHTML=`<button class="action-btn" style="margin:0 0 8px;background:#2c3b4e" onclick="go('home')">⬅️ الرئيسية</button><h2 class="title">🧳 مسيرتك التدريبية</h2>
    <div class="row"><span>السمعة</span><span class="hl">${co.rep} • ${repName(co.rep)}</span></div>
    <div class="row"><span>ألقاب الدوري</span><span class="hl">${co.lt}</span></div><div class="row"><span>الكؤوس</span><span class="hl">${co.ct}</span></div><div class="row"><span>مرات الإقالة</span><span>${co.fired}</span></div>
    <h3 class="hl" style="font-size:14px;margin-top:14px">السجل</h3>`+(co.hist.length?co.hist.slice().reverse().map(h=>`<div class="row"><span>الموسم ${h.s}: ${h.club}<br><span class="dim">${DVN[h.dv]}${h.rk?' • المركز '+h.rk:' • '+h.note}${h.lg?' • 🏆 لقب الدوري':''}${h.cup?' • 🥇 كأس':''}</span></span></div>`).join(''):'<div class="row dim">يُسجَّل بعد نهاية الموسم الأول</div>');
  }else if(t=='jobs'){c.innerHTML=jobsHtml(false);
  }else if(t=='stadium'){
    let d=SD();
    c.innerHTML=`<h2 class="title">🏟️ الاستاد والجماهير</h2>
    <div class="row"><span>السعة</span><span class="hl">${SDC[d.cap].toLocaleString('en')} (مستوى ${d.cap}/4)</span></div>
    <div class="row"><span>شعبية النادي</span><span class="hl">${Math.round(d.fans)}%</span></div>
    <div class="row"><span>طلب الجماهير (خصم متوسط)</span><span>${fanDemand({ovr:66}).toLocaleString('en')}</span></div>
    <div class="row"><span>الحضور المتوقع</span><span class="${fanDemand({ovr:66})>SDC[d.cap]?'win':'hl'}">${attend({ovr:66}).toLocaleString('en')}${fanDemand({ovr:66})>SDC[d.cap]?' • امتلاء كامل (التوسعة مجدية)':''}</span></div>
    <div class="row"><span>الدخل المتوقع لمباراة على أرضك</span><span class="hl">${money(attend({ovr:66})*TP[d.tp])}</span></div>
    <div class="row"><span>الصيانة الأسبوعية</span><span class="loss">-${money(SDU[d.cap])}</span></div>
    <p class="dim">سعر التذكرة (الرخيص يزيد الطلب والشعبية، والمرتفع يقلل الطلب بشدة وقد لا يربحك أكثر عند امتلاء الاستاد)</p>
    <div class="grid">${['رخيص','عادي','مرتفع'].map((n,i)=>`<button class="cb ${d.tp==i?'sel':''}" onclick="tpSet(${i})">${n}<br><span class="dim">${TP[i]} للمقعد</span></button>`).join('')}</div>
    ${d.cap<4?`<button class="action-btn gold" onclick="upStad()">🏗️ توسيع الاستاد إلى ${SDC[d.cap+1].toLocaleString('en')} — ${money(SDX[d.cap])}</button>`:'<p class="hl">أقصى سعة 🌟</p>'}
    <button class="action-btn" onclick="mkt()">📣 حملة تسويقية: +8% جماهير (150k، مرة كل موسم)</button>
    <p class="dim">كلما امتلأت المدرجات زاد تأثير الجمهور لصالحك في المباراة. الشعبية ترتفع بالفوز والمراكز الأولى والألقاب، وتنخفض بالخسارة.</p>`;

function setT(t){G.tactic=t;save();go('tactics')}
function setF(f){G.form=f;save();go('tactics')}
function sign(i){if(G.sponsor)return;let s=SP[i];if(!financePost('s'+G.season+':r'+G.round+':sponsor-signing:'+i,'sponsor-signing-income','مكافأة توقيع عقد الرعاية',s.b))return say('❌ تعذّر تسجيل مكافأة الرعاية.');G.sponsor={n:s.n,w:s.w,k:s.k};save();go('home')}
function transferError(result){return say('❌ '+(result&&result.message?result.message:'تعذّر تنفيذ الصفقة.'))}
function buy(id){let p=G.players.find(x=>x.id==id);if(!p)return say('❌ اللاعب غير موجود.');
  let result=FM4TransferSystem.completePurchase({players:G.players,playerId:id,buyerClubId:G.uid,sellerClubId:p.clubId,fee:val(p),budget:G.budget,contractYears:3,weeklyWage:wageOf(p),season:G.season,loans:G.loans||[]});
  if(!result.ok)return transferError(result);
  if(!financePost('s'+G.season+':r'+(G.round+1)+':transfer-buy:'+id,'transfer-expense','شراء اللاعب '+p.name,-val(p)))return say('❌ تعذّر تسجيل قيمة الانتقال؛ لم يتم إتمام الشراء.');G.players=result.players;let signed=G.players.find(x=>x.id==id);signed.morale=70;save();say('✅ تم شراء '+signed.name+' بعقد 3 مواسم');go('market')}
function negotiationRows(){
  const active=(G.negotiations||[]).filter(n=>['countered','club_accepted','player_countered'].includes(n.status)).slice(-6).reverse();
  return active.length?'<h3 class="title">مفاوضات تحتاج متابعة</h3>'+active.map(n=>{const p=G.players.find(x=>x.id===n.playerId);return p?'<div class="row"><span>'+uiEsc(p.name)+'<br><span class="dim">'+(n.status==='countered'?'عرض مضاد من النادي':n.status==='club_accepted'?'موافقة النادي • بانتظار عقد اللاعب':'طلب راتب مضاد من اللاعب')+'</span></span><button class="mini" onclick="resumeNegotiation(\''+uiEsc(n.id)+'\')">متابعة</button></div>':''}).join(''):'';
}
function startNegotiation(id){
  const p=G.players.find(x=>x.id==id&&x.clubId>0&&x.clubId!==G.uid);
  if(!p)return say('❌ اللاعب لم يعد متاحاً للتفاوض.');
  if((G.loans||[]).some(x=>x.playerId===id&&x.status==='active'))return say('❌ اللاعب مرتبط بإعارة نشطة.');
  const value=val(p),precheck=FM4TransferSystem.validatePurchase({players:G.players,playerId:id,buyerClubId:G.uid,sellerClubId:p.clubId,fee:Math.ceil(value*.85/1000)*1000,budget:G.budget,contractYears:3,weeklyWage:wageOf(p),season:G.season,loans:G.loans||[]});
  if(!precheck.ok)return transferError(precheck);
  const choices=[.85,1,1.15].map(r=>Math.ceil(value*r/1000)*1000);
  menu('تقديم عرض أولي لضم '+p.name,choices.map(fee=>({l:'عرض '+money(fee),fn:()=>beginNegotiation(id,fee)})),true);
}
function beginNegotiation(id,fee){
  const p=G.players.find(x=>x.id==id);if(!p)return say('❌ اللاعب لم يعد متاحاً.');
  const created=FM4NegotiationSystem.createOffer({player:p,buyerClubId:G.uid,budget:G.budget,fee,weeklyWage:wageOf(p),contractYears:3,signingBonus:0,season:G.season,negotiations:G.negotiations||[],playerOnLoan:(G.loans||[]).some(x=>x.playerId===id&&x.status==='active')});
  if(!created.ok)return transferError(created);
  const result=FM4NegotiationSystem.evaluateClubOffer({offer:created.offer,player:p,fee,marketValue:val(p)});
  if(!result.ok)return transferError(result);
  G.negotiations=[...(G.negotiations||[]),result.offer];save();
  if(result.decision==='rejected')return say('❌ رفض '+C(p.clubId).name+' العرض الأول.');
  if(result.decision==='countered')return showClubCounter(result.offer);
  showPlayerContract(result.offer);
}
function showClubCounter(offer){
  const fee=offer.counterFee,items=[
    {l:'قبول قيمة النادي '+money(fee),fn:()=>acceptClubCounter(offer.id)},
    {l:'رفض العرض وإنهاء المفاوضات',fn:()=>rejectNegotiation(offer.id)}
  ];
  if((offer.clubRounds||0)<FM4NegotiationSystem.RULES.maxClubRounds)items.splice(1,0,
    {l:'تقديم عرض أعلى '+money(Math.ceil(fee*1.05/1000)*1000),fn:()=>answerClubCounter(offer.id,Math.ceil(fee*1.05/1000)*1000)});
  menu('عرض مضاد من '+C(offer.sellerClubId).name+' • '+money(fee),items,true);
}
function acceptClubCounter(id){
  const offer=(G.negotiations||[]).find(x=>x.id===id),p=offer&&G.players.find(x=>x.id===offer.playerId);
  if(!offer||!p)return say('❌ انتهت صلاحية المفاوضات.');
  const result=FM4NegotiationSystem.acceptClubCounter({offer,player:p,budget:G.budget});
  if(!result.ok)return transferError(result);
  G.negotiations=G.negotiations.map(x=>x.id===id?result.offer:x);save();showPlayerContract(result.offer);
}
function answerClubCounter(id,fee){
  const offer=(G.negotiations||[]).find(x=>x.id===id),p=offer&&G.players.find(x=>x.id===offer.playerId);
  if(!offer||!p)return say('❌ انتهت صلاحية المفاوضات.');
  const submitted=FM4NegotiationSystem.submitCounterOffer({offer,fee,budget:G.budget});
  if(!submitted.ok)return transferError(submitted);
  const result=FM4NegotiationSystem.evaluateClubOffer({offer:submitted.offer,player:p,fee,marketValue:val(p)});
  if(!result.ok)return transferError(result);
  G.negotiations=G.negotiations.map(x=>x.id===id?result.offer:x);save();
  if(result.decision==='rejected')return say('❌ رفض النادي العرض الجديد.');
  if(result.decision==='countered')return showClubCounter(result.offer);
  showPlayerContract(result.offer);
}
function showPlayerContract(offer){
  const p=G.players.find(x=>x.id===offer.playerId);if(!p)return say('❌ اللاعب لم يعد متاحاً.');
  menu('النادي وافق. اختر مدة عقد اللاعب '+p.name,[2,3,4,5].map(years=>({l:'عقد '+years+' مواسم',fn:()=>showPlayerWageTerms(offer.id,years)})),true);
}
function showPlayerWageTerms(id,years){
  const offer=(G.negotiations||[]).find(x=>x.id===id),p=offer&&G.players.find(x=>x.id===offer.playerId);

const FXN=f=>[['c','ثقة'],['mo','معنويات الفريق'],['pm','معنويات اللاعب'],['m','إعلام'],['f','جماهير'],['b','حماس للمباراة القادمة']].filter(a=>f[a[0]]).map(a=>(f[a[0]]>0?'+':'')+f[a[0]]+' '+a[1]).join('، ');
function applyFx(f,p){let S=PRS();if(f.c)G.conf=cl(G.conf+f.c,0,100);
  if(f.mo)G.players.forEach(x=>{if(x.clubId==G.uid)x.morale=cl(x.morale+f.mo,30,100)});
  if(f.pm&&p)p.morale=cl(p.morale+f.pm,30,100);if(f.m)S.m=cl(S.m+f.m,0,100);
  if(f.f&&G.sd)G.sd.fans=cl(G.sd.fans+f.f,0,100);if(f.b)S.boost=Math.max(S.boost,f.b)}
function plog(t){let S=PRS();S.log.unshift(t);S.log.length=Math.min(S.log.length,4)}
function pressAns(i){let S=PRS();if(!S.q)return;let o=S.q.o[i];applyFx(o);plog('🎤 '+o.x+(FXN(o)?' ('+FXN(o)+')':''));S.q=null;save();go('press')}
function rumFx(r,j,auto){let p=G.players.find(x=>x.id==r.pid),f=auto&&r.k=='board'?{x:'تجاهلت إشاعة الإدارة',m:-1}:RUM[r.k][j].fn(r);if(r.pid&&!p)return;applyFx(f,p);plog((auto?'⏳ ':'🗞️ ')+f.x+(FXN(f)?' ('+FXN(f)+')':''))}
function rumAns(i,j){let S=PRS(),r=S.r[i];if(!r)return;S.r.splice(i,1);rumFx(r,j);save();go('press')}
function rumorGen(){let S=PRS();if(S.r.length>=3)return;let my=G.players.filter(p=>p.clubId==G.uid).sort((a,b)=>b.ovr-a.ovr),t=Math.random(),r;
  if(!my.length)return;
  if(t<.38){let p=pick(my.slice(0,4));r={k:'leave',pid:p.id,pn:p.name,tr:Math.random()<.25+(p.morale<60?.3:0)+((p.cy||3)<=1?.25:0),txt:`تقارير تفيد بأن ${p.name} يفكر في الرحيل عن الفريق!`}}
  else if(t<.68){let p=pick(my.slice(0,5)),cs=G.clubs.filter(c=>c.id!=G.uid);r={k:'rival',pid:p.id,pn:p.name,tr:true,txt:`${pick(cs).name} يتابع ${p.name} ويحضّر عرضاً لضمه`}}
  else if(G.conf<50){r={k:'board',tr:G.conf<35?Math.random()<.7:Math.random()<.3,txt:'مصادر: إدارة النادي تدرس مستقبل المدرب'}}
  else if(S.nw>=2){r={k:'fan',tr:true,txt:'جماهير النادي تهدد بالاحتجاج بسبب النتائج الأخيرة'}}
  else return;
  r.rd=G.round;S.r.push(r)}
function pressAfter(res,gu,go_,opp,cup){let S=PRS(),u=C(G.uid).name,o=opp.name,t=S.m>=60?0:S.m<=40?2:1;
  if(!cup)S.nw=res=='win'?0:(S.nw||0)+1;
  S.hl.unshift((cup?'الكأس: ':`ج${G.round+1}: `)+pick(HL[res][t]).replace('{u}',u).replace('{o}',o));S.hl.length=Math.min(S.hl.length,6);
  if(cup);else if(S.m>=70){G.conf=cl(G.conf+1,0,100);log('📰 الإعلام داعم لك: +1% ثقة','log-goal')}else if(S.m<=30){G.conf=cl(G.conf-1,0,100);log('📰 الإعلام يهاجمك: -1% ثقة','log-bad')}
  if(S.q){S.m=cl(S.m-3,0,100);log('📰 تجاهلت المؤتمر الصحفي السابق: -3 علاقة بالإعلام','log-bad')}
  S.r=S.r.filter(r=>{if(G.round-r.rd>=2){rumFx(r,2,true);return false}return true});
  let k=gu-go_>=3?'big':res=='win'?'win':res=='loss'?'loss':'draw';if(!cup&&S.nw>=3&&res!='win')k='streak';
  let q=pick(PQ[k]);S.q={q:q.q.replace('{o}',o),o:q.o};if(Math.random()<.5)rumorGen();
  log('📰 هناك مؤتمر صحفي وأخبار جديدة في تبويب الصحافة','log-info')}
function pressHtml(){let S=PRS(),m=S.m,h=`<h2 class="title">📰 الصحافة والإشاعات</h2>
  <div class="row"><span>علاقتك بالإعلام:</span><span>${m>=70?'داعم 😊':m<=30?'عدائي 😠':'محايد 😐'} (${m}%)</span></div><div class="cbar"><i style="width:${m}%;background:${m<30?'var(--red)':m<55?'var(--gold)':'var(--pr)'}"></i></div>`;
  if(S.q)h+=`<div class="pcard"><b>🎤 مؤتمر صحفي</b><p>${S.q.q}</p>${S.q.o.map((o,i)=>`<button class="action-btn alt" onclick="pressAns(${i})">${o.t}</button>`).join('')}</div>`;
  S.r.forEach((r,i)=>{h+=`<div class="pcard"><b>🗞️ إشاعة</b><p>${r.txt}</p>${RUM[r.k].map((o,j)=>`<button class="action-btn alt" onclick="rumAns(${i},${j})">${o.t}</button>`).join('')}</div>`});
  if(!S.q&&!S.r.length)h+='<div class="dim" style="text-align:center;padding:14px">لا جديد في الصحافة الآن. العب مباراة وسيتحرك الإعلام.</div>';
  if(S.log.length)h+='<h3>📝 آخر ردودك</h3>'+S.log.map(x=>`<div class="row"><span>${x}</span></div>`).join('');
  return h+'<h3>📰 عناوين الصحف</h3>'+(S.hl.length?S.hl.map(x=>`<div class="row"><span>${x}</span></div>`).join(''):'<div class="dim">لا عناوين بعد</div>')}

function endMatch(){
  let U=G.uid,gu=M.gu,go_=M.go,opp=M.opp,home=M.home;(G.ml||(G.ml=[])).push({s:G.season,r:G.round,o:opp.name,gu,go:go_,h:home,m:M.bst?M.bst.name:'',d:M.derby||''});
  apply(home?U:opp.id,home?opp.id:U,home?gu:go_,home?go_:gu);
  G.fix[G.round].forEach(p=>{if(!p.includes(U))simAI(p[0],p[1])});
  let res=gu>go_?'win':gu<go_?'loss':'draw',txt=gu>go_?'فوز 🎉':gu<go_?'خسارة 😞':'تعادل';
  log(`📊 استحواذ ${Math.round(M.ps/M.min)}% | تسديدات ${M.sh[0]}-${M.sh[1]}${M.sc.length?' | الأهداف: '+M.sc.join('، '):''}`,'log-info');sb();log(`\n🏁 النتيجة النهائية: ${gu} - ${go_} ضد ${opp.name} (${txt})`,'log-info');
  let gate=(home?Math.round((M.att||9000)*TP[SD().tp]):20000)+(res=='win'?15000:0);
  let wages=G.players.filter(p=>p.clubId==U).reduce((s,p)=>s+wg(p),0)+ACW[AC().lv]+SDU[SD().cap];
  let spn=G.sponsor?G.sponsor.w:0,financePrefix='s'+G.season+':r'+(G.round+1)+':';
  const settlement=[{eventId:financePrefix+'match-gate',category:'match-income',description:'مداخيل المباراة',amount:gate}];if(spn)settlement.push({eventId:financePrefix+'sponsor',category:'sponsor-income',description:'دخل عقد الرعاية',amount:spn});if(wages)settlement.push({eventId:financePrefix+'weekly-costs',category:'operating-expense',description:'الأجور والأكاديمية وصيانة الاستاد',amount:-wages});
  if(financePostBatch(settlement))log(`💰 مداخيل ${money(gate)} + رعاية ${money(spn)} - أجور ${money(wages)}`,res=='loss'?'log-bad':'log-goal');else log('⚠️ تعذّر تسجيل تسوية المباراة المالية بالكامل؛ لم تُرحّل أي حركة من هذه المجموعة','log-bad');
  let st=G.st||(G.st={cs:0,best:0,cur:0});if(go_==0)st.cs++;if(res=='loss')st.cur=0;else{st.cur++;st.best=Math.max(st.best,st.cur)}
  (G.obj||[]).forEach(o=>{if(!o.n&&['wins','goals','cs','streak'].includes(o.k)&&met(o)){o.n=1;log('🎯 هدف محقق: '+otxt(o)+' (المكافأة تُصرف نهاية الموسم)','log-goal')}});
  let dd=M.O.pw-M.pw0,sc0=res=='win'?1:res=='draw'?.5:0,ex0=cl(.47-dd*.03,.12,.88);G.conf=cl(Math.round(G.conf+7*(sc0-ex0)+(60-G.conf)*.03),0,100);
  if(G.budget<0){G.conf=Math.max(0,G.conf-3);log('⚠️ ميزانية سالبة: الإدارة غاضبة (-3% ثقة)','log-bad')}
  let ld=M.xi.some(x=>trt(x)=='leader');G.fan=cl(fan()+(res=='win'?(home?5:3):res=='loss'?(home?-6:-3):0),0,100);if(M.derby){G.fan=cl(G.fan+(res=='win'?5:res=='loss'?-6:0),0,100);G.conf=cl(G.conf+(res=='win'?4:res=='loss'?-4:0),0,100);G.news.push(`🔥 ${M.derby}: ${C(U).name} ${gu}-${go_} ${opp.name}`);log(`🔥 ${M.derby}: ${res=='win'?'انتصار تاريخي يشعل المدرجات! (+4% ثقة)':res=='loss'?'خسارة موجعة في الديربي (-4% ثقة)':'تعادل بطعم مرّ'}`,res=='loss'?'log-bad':'log-goal')}if(home&&res=='loss'&&G.fan<25){G.conf=cl(G.conf-2,0,100);G.news.push('الجماهير غاضبة وتهتف ضد المدرب بعد الخسارة');log('📣 الجماهير غاضبة عند صافرة النهاية! (-2% ثقة)','log-bad')}G.players.forEach(p=>{
    if(p.inj>0)p.inj--;else if(p.clubId>0&&Math.random()<.012*(trt(p)=='fragile'?2.2:1)){p.inj=R(1,4);
      if(p.clubId==U)log(`🚑 إصابة ${p.name} لمدة ${p.inj} أسابيع`,'log-bad')}
    if(p.clubId==U)p.morale=cl(p.morale+(res=='win'?5:res=='loss'?-6+(ld?2:0):0)-(trt(p)=='hot'&&!p.inj&&!M.xi.includes(p)?2:0),30,100)});
  if(G.sponsor&&--G.sponsor.k<=0){G.sponsor=null;log('انتهى عقد الرعاية','log-info')}
  G.news.push(`ج${G.round+1}: ${home?C(U).name+' '+gu+'-'+go_+' '+opp.name:opp.name+' '+go_+'-'+gu+' '+C(U).name} (${txt})`);
  pressAfter(res,gu,go_,opp);trainWeek();sdMatch(home,res);G.date+=7*864e5;G.round++;cupCheck();offerCheck();
  if(G.round%2==0)refreshMarket();
  let done=G.round>=14;if(done)endSeason();
  save();clearMatchSession();busy=false;M=null;shadowMonitor=null;document.body.classList.remove('match-live');hdr();$('ctl').style.display='none';
  $('content').style.display='block';$('content').innerHTML=`<button class="action-btn" onclick="go('home')">متابعة</button>`;if(!done)setTimeout(lockerEvent,700)}

function endSeason(){
  if(G.round<14||G.lastCompletedSeason===G.season){console.warn('FM4 season lifecycle: season is not ready or already finalized',G.season,G.round);return false}
  const loanPreflight=FM4TransferSystem.returnLoansAtSeasonEnd({players:G.players,loans:G.loans||[],season:G.season});if(!loanPreflight.ok){console.error('FM4 loan lifecycle:',loanPreflight.code,loanPreflight.message);G.news.push('⚠️ تعذّر التحقق من سجلات الإعارة؛ لم تُغيّر ملكية اللاعبين المعارين')}
  const negotiationExpiry=FM4NegotiationSystem.expireAtSeasonEnd({negotiations:G.negotiations||[],season:G.season});if(negotiationExpiry.ok){G.negotiations=negotiationExpiry.negotiations;if(negotiationExpiry.expired)G.news.push('⌛ انتهت '+negotiationExpiry.expired+' مفاوضات غير مكتملة مع نهاية الموسم');}
  let t=table(),rk=t.findIndex(x=>x.id==G.uid)+1,rw=(rk==1?900000:rk==2?500000:rk==3?250000:50000)*(C(G.uid).dv==2?.5:1);
  if(!financePost('s'+G.season+':league-prize','league-prize','مكافأة مركز الدوري',rw)){G.news.push('⚠️ تعذّر تسجيل مكافأة مركز الدوري');rw=0}G.conf=cl(G.conf+cl(((G.exp||rk)-rk)*5,-15,15)+(rk<=3?4:0),0,100);
  let msg=`<b>🏁 نهاية الموسم ${G.season}</b><br>البطل: ${t[0].name}<br>مركزك: ${rk}<br>مكافأة: ${money(rw)}`;
  G.news.push(`نهاية الموسم ${G.season}: البطل ${t[0].name} ومركزك ${rk}`);
  let sd=buildStory(t,rk);
  msg+=(G.cup&&G.cup.msg?'<br>'+G.cup.msg:'')+objEnd()+awards()+contractsEnd()+academyEnd()+sdEnd()+coachRec()+promoEnd()+jobsEnd();
  (G.story||(G.story=[])).push(sd);G.ml=[];
  G.players.forEach(p=>{if(p.clubId<=0)return;p.age++;
    p.ovr=cl(p.ovr+(p.age<24?R(0,3):p.age<30?R(-1,1):-R(0,3)),40,92);p.morale=70;p.inj=0;
    if(p.age>=36){let c=C(p.clubId);Object.assign(p,mkPlayer(p.clubId,p.pos,Math.max(50,c.ovr-12),true),{id:p.id,pot:undefined,xp:0,cy:3,wg:undefined})}});
  const loanReturn=FM4TransferSystem.returnLoansAtSeasonEnd({players:G.players,loans:G.loans||[],season:G.season});
  if(loanReturn.ok){G.players=loanReturn.players;G.loans=loanReturn.loans;loanReturn.returnedPlayerIds.forEach(id=>{const p=G.players.find(x=>x.id===id);if(p&&p.loanContractExpired){p.clubId=0;p.wg=0;p.cy=0;delete p.loanContractExpired}});if(loanReturn.returnedPlayerIds.length)G.news.push('🔁 عودة '+loanReturn.returnedPlayerIds.length+' لاعباً من الإعارة بعد نهاية الموسم');}
  G.lastCompletedSeason=G.season;G.season++;G.round=0;G.fix=mkFix();
  G.clubs.forEach(c=>Object.assign(c,{pts:0,p:0,w:0,d:0,l:0,gf:0,ga:0}));
  aiRefresh();genObj();newCup();msg+='<br><br>تقدم عمر اللاعبين وتغيرت مستوياتهم.<br>🎯 وصلت أهداف جديدة من الإدارة للموسم القادم.';
  setTimeout(()=>showStory(sd,()=>ask(msg)),400)}
