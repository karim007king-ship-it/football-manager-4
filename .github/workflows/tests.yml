name: FM4 checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  match-engine-tests:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run match engine tests
        run: npm test
